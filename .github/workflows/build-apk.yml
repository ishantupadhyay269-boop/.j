name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls jarvis-android-complete*.zip | sort | tail -n 1)
          echo "Using: $ZIP"
          unzip -oq "$ZIP"

      - name: Write correct package.json
        working-directory: jarvis
        run: |
          cat > package.json <<'EOF'
          {
            "name": "jarvis",
            "version": "1.1.0",
            "main": "index.ts",
            "dependencies": {
              "@react-native-async-storage/async-storage": "2.2.0",
              "@react-native-voice/voice": "^3.2.4",
              "expo": "~54.0.0",
              "expo-battery": "~10.0.8",
              "expo-build-properties": "~1.0.10",
              "expo-dev-client": "~6.0.21",
              "expo-intent-launcher": "~13.0.8",
              "expo-local-authentication": "~17.0.9",
              "expo-modules-core": "~3.0.30",
              "expo-network": "~8.0.8",
              "expo-secure-store": "~15.0.8",
              "expo-speech": "~14.0.8",
              "expo-status-bar": "~3.0.9",
              "react": "19.1.0",
              "react-native": "0.81.5",
              "react-native-safe-area-context": "~5.6.0"
            },
            "devDependencies": {
              "@types/react": "~19.1.10",
              "typescript": "~5.9.2"
            }
          }
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: jarvis
        run: npm install

      - name: Generate native android project
        working-directory: jarvis
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: jarvis/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/android/app/build/outputs/apk/release/*.apk
