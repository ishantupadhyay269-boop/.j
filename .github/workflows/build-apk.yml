name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "Repo files:"; ls -la
          ZIP=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -o "$ZIP" -d project
          else
            echo "No zip found, using repo files directly"
            mkdir project
            shopt -s extglob dotglob
            cp -r !(project|.git|.github) project/
          fi
          APP=$(dirname "$(find project -name app.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$APP" >> $GITHUB_ENV
          echo "App folder: $APP"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npx expo install --fix

      - name: Prebuild
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --clean

      - name: Apply duplicate-class fix
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSpace=1g" | sed 's/MetaspaceSpace/Metaspace/' >> gradle.properties
          grep -q "exclude group: 'com.android.support'" app/build.gradle || \
            printf "\nconfigurations.all {\n    exclude group: 'com.android.support'\n}\n" >> app/build.gradle
          tail -5 app/build.gradle

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
