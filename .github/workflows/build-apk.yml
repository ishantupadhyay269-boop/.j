name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o jarvis-android-fixed.zip
          ls jarvis

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: jarvis
        run: |
          npm install
          npx expo install --fix

      - name: Prebuild
        working-directory: jarvis
        run: npx expo prebuild --platform android --clean

      - name: Apply duplicate-class fix
        working-directory: jarvis/android
        run: |
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          grep -n "com.android.support" app/build.gradle || \
            printf "\nconfigurations.all {\n    exclude group: 'com.android.support'\n}\n" >> app/build.gradle
          tail -5 app/build.gradle

      - name: Build release APK
        working-directory: jarvis/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/android/app/build/outputs/apk/release/*.apk
